name: Cataclysm AI Android
on:
  push:
    branches: [ai-alpha]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.ref == 'refs/heads/ai-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y gettext ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: android-arm64-r28-${{ github.sha }}
          restore-keys: android-arm64-r28-
      - name: Build signed ARM64 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -Pabi_arm_32=false -Pj=3 -Poverride_version=AI-0.1 assembleExperimentalRelease
          apk=$(find app/build/outputs/apk -name '*.apk' -print -quit)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/alpha.jks" -storepass android -keypass android -alias alpha -keyalg RSA -validity 3650 -dname 'CN=LorencStudio Alpha'
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/alpha.jks" --ks-pass pass:android --out ../Cataclysm-AI-0.1-arm64.apk "$apk"
          "$tools/apksigner" verify --verbose ../Cataclysm-AI-0.1-arm64.apk
          unzip -l ../Cataclysm-AI-0.1-arm64.apk > "$RUNNER_TEMP/apk-files"
          grep 'lib/arm64-v8a/libmain.so' "$RUNNER_TEMP/apk-files"
          grep 'assets/data/core/' "$RUNNER_TEMP/apk-files" | head -1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-AI-0.1-arm64
          path: Cataclysm-AI-0.1-arm64.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ai-0.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" Cataclysm-AI-0.1-arm64.apk --target "$GITHUB_SHA" --prerelease --title 'Cataclysm AI Alpha 0.1' --notes "ARM64 · $GITHUB_SHA"
