name: Cataclysm AI Android
on:
  push:
    branches: [ai-alpha]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.ref == 'refs/heads/ai-alpha' && !startsWith(github.event.head_commit.message, 'Test published APK ')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y gettext ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: android-arm64-r28-${{ github.sha }}
          restore-keys: android-arm64-r28-
      - name: Include official tilesets, sounds, shaders and translations
        run: |
          tag=cdda-experimental-2026-11-24-1832
          archive="$RUNNER_TEMP/official.apk"
          curl --fail --location --retry 3 "https://github.com/CleverRaven/Cataclysm-DDA/releases/download/$tag/cdda-android-x64-2026-11-24-1832.apk" -o "$archive"
          echo "b1ccf4ff05569287ce92358ff3155bb06538e40b8b472b7910772331819b2cbf  $archive" | sha256sum -c -
          unzip -q "$archive" 'assets/gfx/*' 'assets/lang/mo/*' 'assets/data/shaders/*' 'assets/data/sound/*' -d "$RUNNER_TEMP/official"
          cp -a "$RUNNER_TEMP/official/assets/." .
      - name: Build signed ARM64 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -Pabi_arm_32=false -Pj=3 -Poverride_version=AI-0.1 assembleExperimentalRelease
          apk=$(find app/build/outputs/apk -name '*.apk' -print -quit)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/alpha.jks" -storepass android -keypass android -alias alpha -keyalg RSA -validity 3650 -dname 'CN=LorencStudio Alpha'
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/alpha.jks" --ks-pass pass:android --out ../Cataclysm-AI-0.1-arm64.apk "$apk"
          "$tools/apksigner" verify --verbose ../Cataclysm-AI-0.1-arm64.apk
          unzip -l ../Cataclysm-AI-0.1-arm64.apk > "$RUNNER_TEMP/apk-files"
          grep 'lib/arm64-v8a/libmain.so' "$RUNNER_TEMP/apk-files"
          grep -q 'assets/data/core/' "$RUNNER_TEMP/apk-files"
          grep -q 'assets/gfx/UltimateCataclysm/tileset.txt' "$RUNNER_TEMP/apk-files"
          grep -q 'assets/lang/mo/ru/LC_MESSAGES/' "$RUNNER_TEMP/apk-files"
      - uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-AI-0.1-arm64
          path: Cataclysm-AI-0.1-arm64.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ai-0.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" Cataclysm-AI-0.1-arm64.apk --target "$GITHUB_SHA" --prerelease --title 'Cataclysm AI Alpha 0.1' --notes "ARM64 · $GITHUB_SHA"
  smoke:
    needs: apk
    if: always() && !cancelled() && github.ref == 'refs/heads/ai-alpha' && (needs.apk.result == 'success' || (needs.apk.result == 'skipped' && startsWith(github.event.head_commit.message, 'Test published APK ')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download published APK for retest
        if: needs.apk.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag=$(head -1 <<< "$MESSAGE" | cut -d' ' -f4)
          [[ "$tag" =~ ^ai-0[.]1-[0-9]+-[0-9]+$ ]]
          gh release download "$tag" --pattern Cataclysm-AI-0.1-arm64.apk
      - uses: actions/download-artifact@v4
        if: needs.apk.result == 'success'
        with:
          name: Cataclysm-AI-0.1-arm64
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disk-size: 6G
          script: python3 tools/ai/android_smoke.py
